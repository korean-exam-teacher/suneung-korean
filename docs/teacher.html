<style>
@font-face{font-family:"YongbiTitle";font-weight:400 800;font-display:swap;src:url(fonts/oh-nanum.woff) format("woff")}
:root{--bg:#FEFEFD;--surface:#FFFFFF;--soft:#F5F4F1;--line:#E7E7E4;--line-strong:#D2D2CD;--text:#262625;--sub:#62625E;--faint:#9A9A95;--brand:#2F4F7F;--ok:#1f7a4d;--no:#b33a2b;

*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);color:var(--text);background:var(--bg);line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}

ul.ev{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}ul.ev li{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.ok{color:var(--ok)}.no{color:var(--no)}

.wans{white-space:pre-wrap;font-size:14px;background:var(--soft);border-radius:10px;padding:10px 12px;margin:6px 0}
.mk-f{display:flex;gap:8px;margin:0 0 10px}.mk-f input{flex:1;min-width:0;font-size:16px;border-radius:999px;padding:11px 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.chip{border:1px solid var(--line-strong);background:none;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer}.chip.on{border-color:var(--brand);color:var(--brand);font-weight:700}
.mk-l{list-style:none;margin:8px 0;padding:0;border-top:1px solid var(--line)}.mk-l li{border-bottom:1px solid var(--line)}
.mk-r{display:grid;grid-template-columns:28px 170px 64px 90px 1fr 50px;gap:10px;align-items:center;padding:10px 4px;font-size:14px}
.mk-r small{display:block;color:var(--faint);font-size:12px}.mk-r .tx{line-height:1.5;color:var(--text)}.mk-r .tg{font-size:12px;background:var(--soft);border-radius:999px;padding:2px 8px;text-align:center;color:var(--sub)}
.mk-r input{width:18px;height:18px}.mk-v{padding:0 4px 14px 42px}.mk-v img{display:block;max-width:100%;height:auto;margin:6px 0;border-radius:4px}
mark{background:rgba(242,214,92,.55);color:inherit;border-radius:2px}
.mk-bk{position:sticky;top:58px;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);border:1px solid var(--brand);border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:14px}.mk-bk b{color:var(--brand)}
.rs td,.rs th{padding:8px 10px}.rs td.c{text-align:right;color:var(--sub)}.rs td.c.key{color:var(--ok);font-weight:700}.rs td.c.trap{color:var(--no);font-weight:700}.rs td.t{white-space:normal;min-width:200px}.rs tr.x td{background:var(--soft);white-space:normal;cursor:default}.rs tr.x img{display:block;max-width:min(100%,720px);height:auto;margin:6px 0}
.mk-auto{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:14px}.mk-auto input[type=number]{width:74px;padding:6px 8px}.ck{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--sub);cursor:pointer}.ck input{width:17px;height:17px;margin:0}
.clc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.clc div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;background:var(--surface)}.clc div.on{border-color:var(--brand)}.clc b{font-size:14.5px}.clc small{color:var(--sub);margin-left:6px}
select.cls{width:130px;padding:5px 8px;font-size:13.5px}
.cm{display:flex;flex-wrap:wrap;gap:4px;align-items:center;max-width:280px}.cm .tag{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 10px}.cm .tag.ro{padding:2px 10px;opacity:.7}
.cx{border:0;background:none;font:inherit;font-size:15px;line-height:1;color:var(--faint);cursor:pointer;padding:2px 5px;border-radius:999px}.cx:hover{color:var(--no)}
select.cadd{width:92px;padding:4px 6px;font-size:13px;color:var(--sub)}
.who{display:inline-block;font-size:12.5px;background:var(--brand);color:#fff;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:3px;font-weight:600}
@media (max-width:760px){.mk-r{grid-template-columns:24px minmax(0,1fr) 46px}.mk-r .hide{display:none}.mk-v{padding-left:4px}}
@media (max-width:760px){.kp{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.bars div{grid-template-columns:120px 1fr 70px}.top nav button{padding:8px 8px;font-size:14px}}
</style>

<body>
<header class="top"><a class="brand" href="/suneung-korean/">국어의 모든 것</a><nav id="nav" hidden><a class="home" href="/suneung-korean/">처음 화면</a><button type="button" data-v="st" class="on">학생 현황</button><button type="button" data-v="asg">과제</button><button type="button" data-v="rs">응답률</button><button type="button" data-v="nt">공지</button><button type="button" data-v="adm" id="admTab" hidden>선생님 관리</button><button type="button" id="out">로그아웃</button></nav></header>
<main class="wrap" id="main"></main>
<script src="js/account.js?v=108" data-noui></script>
<script>
(function(){
/* account.js 와 같은 서버 주소를 쓴다 */
var ON=!!(window.KMA&&KMA.on), FBM=!!(window.KMA&&KMA.fb);
var G={hak:'개념 학습',seo:'서·논술형',sn:'수능',non:'대학 논술',adv:'PSAT·LEET·임용·공무원'}, GO=['hak','seo','sn','non','adv'];
var SUB={gm:'공무원',psat:'PSAT',leet:'LEET',im:'임용'}, GS={hak:'개념 학습',seo:'서·논술형',sn:'수능',non:'대학 논술',adv:'PSAT 등'};
var $=function(id){return document.getElementById(id);}, M=$('main');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pct(c,t){ if(!t) return '<span class="pc">–</span>'; var p=Math.round(c/t*100); return '<span class="pc '+(p<50?'lo':p>=80?'hi':'')+'">'+p+'%</span>'; }
function day(t){ if(!t) return '–'; var d=new Date(t); return (d.getMonth()+1)+'.'+d.getDate(); }
function ago(t){ if(!t) return '–'; var h=(Date.now()-t)/3600000; return h<1?'방금':h<24?Math.floor(h)+'시간 전':Math.floor(h/24)+'일 전'; }
function nice(k){ var p=k.split(':'); if(p[0]==='adv') return (SUB[p[1]]||p[1])+' '+p.slice(2).join(':'); return (G[p[0]]||p[0])+' · '+p.slice(1).join(':'); }
function stt(e){ return e.f&&e.o?'<span class="ok">맞힘</span>':e.f?'<span class="no">처음엔 맞힘 · 최근 틀림</span>':e.o?'<span class="ok">다시 풀어 맞힘</span>':'<span class="no">틀림</span>'; }
var ADM=false, PW=sessionStorage.getItem('kma.tpw')||'', D=null, VIEW=(location.hash||'#st').slice(1), CLS='', OPEN=null;
function call(fn,args){ return KMA.call(fn,args); }

if(!ON){ M.innerHTML='<h1>학생 현황</h1><p class="sub">아직 서버 주소가 없어요. 앱스 스크립트(Site.gs)를 배포한 뒤 나온 주소를 /suneung-korean/js/account.js 의 KMA_URL 과 이 파일에 넣어 주세요.</p>'; return; }
function loginView(msg){
  $('nav').hidden=true;
  M.innerHTML='<div class="card" style="max-width:460px;margin:40px auto"><h1>선생님만 볼 수 있어요</h1><p class="sub">학생 현황·과제·공지는 선생님으로 등록된 아이디로 로그인해야 열려요. '+esc(msg||'')+'</p><div class="bar" style="margin:0"><a class="btn pri" href="/suneung-korean/" style="text-decoration:none">처음 화면으로</a><button class="btn" type="button" id="lo">로그아웃</button></div></div>';
  $('lo').onclick=function(){ KMA.logout(); };
}
function load(){
  M.innerHTML='<p class="sub">불러오는 중…</p>';
  call('teacherSite',[PW]).then(function(r){
    if(!r.ok){ sessionStorage.removeItem('kma.tpw'); PW=''; return loginView(r.msg); }
    D=r; scope(); $('nav').hidden=false; $('admTab').hidden=!ADM; paint();
  });
}
document.querySelectorAll('#nav [data-v]').forEach(function(b){ b.onclick=function(){ VIEW=b.dataset.v; OPEN=null; history.replaceState(null,'','#'+VIEW); paint(); }; });
$('out').onclick=function(){ PW=''; KMA.logout(); };
window.addEventListener('hashchange',function(){ var v=(location.hash||'#st').slice(1); if(D&&v!==VIEW&&/^(st|asg|rs|nt|adm)$/.test(v)){ VIEW=v; OPEN=null; paint(); } });
function paint(){
  document.querySelectorAll('#nav [data-v]').forEach(function(b){ b.classList.toggle('on',b.dataset.v===(VIEW==='make'?'asg':VIEW)); });
  if(VIEW==='make') return makeView(); if(VIEW==='asg') return asgView(); if(VIEW==='rs') return rsView(); if(VIEW==='nt') return ntView(); if(VIEW==='adm'&&ADM) return admView(); stView();
}
/* v108: 학생 한 명이 여러 학급에 — users.cls 는 학급 이름을 줄바꿈으로 이은 글자열 */
function clsOf(v){ return String(v||'').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); }
function inC(v,name){ return clsOf(v).indexOf(name)>=0; }
/* v107: 학급 — 관리자는 모두, 선생님은 자기가 담임인 학급의 학생·과제·공지만 본다 */
function scope(){
  var reg=D.cls||{}, me=D.me||{uid:''};
  D.all=D.all||D.rows; D.asgAll=D.asgAll||D.asg; D.ntAll=D.ntAll||D.nt;
  D.cl=Object.keys(reg).map(function(k){ var c=reg[k]; return {id:k,name:c.name,own:c.own,ownId:c.ownId||'',ownName:c.ownName||''}; }).sort(function(a,b){ return a.name<b.name?-1:1; });
  D.my=ADM?D.cl:D.cl.filter(function(c){ return c.own===me.uid; });
  var mine={}, known={}; D.my.forEach(function(c){ mine[c.name]=1; }); D.cl.forEach(function(c){ known[c.name]=1; });
  D.mine=mine;
  D.free=D.all.filter(function(x){ return !clsOf(x.sum.cls).some(function(n){ return known[n]; }); });
  if(ADM){ D.rows=D.all; D.asg=D.asgAll; D.nt=D.ntAll; }
  else { D.rows=D.all.filter(function(x){ return clsOf(x.sum.cls).some(function(n){ return mine[n]; }); });
    D.asg=D.asgAll.filter(function(a){ return a.by===me.uid||(a.cls&&mine[a.cls])||(!a.by&&!a.cls); });
    D.nt=D.ntAll.filter(function(n){ return n.by===me.uid||(n.cls&&mine[n.cls])||(!n.by&&!n.cls); }); }
}
/* ---------- 학생 현황 ---------- */
function classes(){ return (D.my||[]).map(function(c){ return c.name; }); }
function clsOpts(cur,all){ var L=classes(); return (all?'<option value="">'+all+'</option>':'')+L.map(function(c){ return '<option'+(c===cur?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+(cur&&L.indexOf(cur)<0?'<option selected>'+esc(cur)+'</option>':''); }
function asgFor(r){ return D.asg.filter(function(a){ return !a.cls||inC(r.sum.cls,a.cls); }); }
function stView(){
  var FREE=CLS==='__free__';
  if(CLS&&!FREE&&classes().indexOf(CLS)<0) CLS='';
  var rows=(FREE?D.free:D.rows.filter(function(r){ return !CLS||inC(r.sum.cls,CLS); })).sort(function(a,b){ return (b.sum.last||0)-(a.sum.last||0); });
  var cnt={}; D.all.forEach(function(x){ clsOf(x.sum.cls).forEach(function(n){ cnt[n]=(cnt[n]||0)+1; }); });
  /* 학급 칸: 관리자는 여러 학급에 넣고 뺄 수 있고, 선생님은 자기 학급 가운데 하나를 고른다(다른 선생님 학급은 그대로 둔다) */
  var clsCell=function(r){ var L=clsOf(r.sum.cls), all=classes();
    if(ADM){ var rest=all.filter(function(c){ return L.indexOf(c)<0; });
      return '<span class="cm" data-cm="'+esc(r.id)+'">'+L.map(function(n){ return '<span class="tag">'+esc(n)+'<button type="button" class="cx" data-x="'+esc(n)+'" aria-label="'+esc(n)+'에서 빼기" title="이 학급에서 빼기">×</button></span>'; }).join('')+
        (rest.length?'<select class="cadd" aria-label="'+esc(r.id)+' 학급에 넣기"><option value="">＋ 학급</option>'+rest.map(function(c){ return '<option>'+esc(c)+'</option>'; }).join('')+'</select>':'')+'</span>'; }
    var my=L.filter(function(n){ return D.mine[n]; }), other=L.filter(function(n){ return !D.mine[n]; });
    return '<span class="cm"><select class="cls" data-c="'+esc(r.id)+'" aria-label="'+esc(r.id)+' 학급">'+clsOpts(my[0]||'','없음')+'</select>'+other.map(function(n){ return '<span class="tag ro" title="다른 선생님의 학급">'+esc(n)+'</span>'; }).join('')+'</span>'; };
  var wk=rows.filter(function(r){ return r.sum.wk; }).length, tot=rows.reduce(function(a,r){return a+r.sum.n;},0), f=rows.reduce(function(a,r){return a+r.sum.f;},0);
  var dd=[]; for(var i=13;i>=0;i--){ var d=new Date(Date.now()-i*86400000+9*3600000).toISOString().slice(0,10); dd.push(d); }
  var h='<h1>학생 현황</h1><p class="sub">'+new Date(D.at).toLocaleString('ko-KR')+' 기준 · 아이디를 만든 학생이 모두 나와요. 줄을 누르면 자세히 볼 수 있고, 이름·학급은 여기서 고칠 수 있어요. <button class="lnk" type="button" id="rl">새로 고침</button></p>'+
    '<div class="kp"><div><b>'+rows.length+'</b><small>학생</small></div><div><b>'+wk+'</b><small>최근 7일 공부한 학생</small></div><div><b>'+tot.toLocaleString()+'</b><small>푼 문제(모두)</small></div><div><b>'+(tot?Math.round(f/tot*100)+'%':'–')+'</b><small>첫 시도 정답률</small></div></div>'+
    '<div class="clc">'+(D.my.length?D.my.map(function(c){ return '<div class="'+(c.name===CLS?'on':'')+'"><b>'+esc(c.name)+'</b><small>'+(cnt[c.name]||0)+'명'+(ADM?' · 담임 '+esc(c.ownName||c.ownId||'?'):'')+'</small></div>'; }).join(''):'<div>아직 학급이 없어요. 아래 ‘＋ 학급 만들기’로 학급을 만든 뒤, ‘학급 없는 학생’에서 우리 반 학생을 골라 넣어 주세요.</div>')+'</div>'+

function picH(p){ return '<img src="'+esc(p.s)+'" alt="" loading="lazy">'; }
function mkShow(ids){
  var el=$('mkV'); if(!el) return;
  if(MK.src!=='gm'){ var S=SRC(), h='', seenP={}, pas=false;
    ids.forEach(function(id){ var x=byId(id), it=x.it;
      if(it.p&&it.p.imgs){ var pk=JSON.stringify(it.p.imgs[0]); if(!seenP[pk]){ seenP[pk]=1; h+=it.p.imgs.map(picH).join(''); } }
      else if(x.pk&&S.pas&&S.pas[x.pk]&&!pas){ pas=true; h+='<div class="wans" style="max-height:320px;overflow:auto">'+esc(S.pas[x.pk])+'</div>'; }
      if(it.txt){ h+='<p style="margin:10px 0 4px"><b>'+esc(x.n?x.n+'. ':'')+esc(it.txt.ask)+'</b></p>'+(it.txt.body?'<div class="wans">'+esc(it.txt.body)+'</div>':'')+((it.txt.ch||[]).length?'<ol style="margin:4px 0 0;padding-left:22px;list-style:none">'+it.txt.ch.map(function(c,i){ return '<li>'+CIRC[i]+' '+esc(c)+'</li>'; }).join('')+'</ol>':''); }
      h+=(it.q||[]).map(picH).join('');
      h+='<p class="sub" style="margin:4px 0 12px">'+(it.nc?(it.ans?'정답 '+CIRC[it.ans-1]:'정답 없음(채점 안 함)'):'서술형 — 학생이 글로 답해요')+'</p>'; });
    el.innerHTML=h; return; }
  var D2=window.GM_DATA, it0=D2.items[ids[0]], e=GMFind.EX[it0.e];
  gmQ(it0.e).then(function(d){ var el=$('mkV'); if(!el) return;
    if(!d){ el.innerHTML='<p class="msg">그림을 불러오지 못했어요.</p>'; return; }
    if(e.mode==='pg'){ el.innerHTML='<p class="sub">이 회차는 시험지 쪽 그림으로만 있어요. 학생 과제 화면에는 \'시험지에서 보기\' 링크로 나옵니다. <a href="/advanced-korean/gongmuwon.html#exam/'+e.id+'" target="_blank" rel="noopener">시험지 보기 ↗</a></p>'; return; }
    var h='', seen={}; ids.forEach(function(id){ var n=+D2.items[id].n;
      (d.p||[]).forEach(function(p,i){ if(p.rng[0]<=n&&n<=p.rng[1]&&!seen[i]){ seen[i]=1; h+='<img src="'+p.img+'" alt="지문">'; } });
      (d.q||[]).forEach(function(q){ if(q.n===n) h+='<img src="'+q.img+'" alt="'+n+'번">'; });
      h+='<p class="sub" style="margin:0 0 10px">'+n+'번 정답 '+(CIRC[(+D2.items[id].ans||1)-1]||'')+'</p>'; });
    el.innerHTML=h; });
}
function mkForm(){

    '<div class="card" style="max-width:620px"><div class="grid2"><div><label class="sub" style="display:block;margin:0 0 4px">종류</label><select id="mkK" style="width:100%"><option value="">과제 · 시간 제한 없음</option><option value="exam"'+(X?' selected':'')+'>모의고사 · 정한 시간 안에</option></select></div><div><label class="sub" style="display:block;margin:0 0 4px">제한 시간(분)</label><input type="number" id="mkMin" min="1" max="300" style="width:100%" value="'+dmin+'"'+(X?'':' disabled')+'></div></div>'+
    '<p class="sub" id="mkXN" style="margin:8px 0 0;font-size:13px"'+(X?'':' hidden')+'>모의고사는 학생이 ‘시작하기’를 누른 때부터 시간이 흐르고, 시간이 끝나면 그때까지 고른 답이 자동으로 제출돼요.</p>'+
    '<label class="sub" style="display:block;margin:12px 0 4px">제목</label><input type="text" id="mkT" maxlength="60" style="width:100%" value="'+esc(dstr+(X?' 모의고사':' 국어 과제'))+'">'+
    '<label class="sub" style="display:block;margin:12px 0 4px">안내 말(선택)</label><textarea id="mkM" maxlength="400" style="min-height:70px"></textarea>'+
    '<div class="grid2" style="margin-top:4px"><div><label class="sub" style="display:block;margin:8px 0 4px">마감일(선택)</label><input type="date" id="mkD" style="width:100%"></div><div><label class="sub" style="display:block;margin:8px 0 4px">학급</label><select id="mkC" style="width:100%">'+(ADM?clsOpts(MK.cls||'','모든 학생'):(cls.length?clsOpts(MK.cls||cls[0],''):'<option value="">학급이 없어요</option>'))+'</select></div></div>'+
    (!ADM&&!cls.length?'<p class="msg" style="margin:8px 0 0">먼저 ‘학생 현황’에서 학급을 만들고 학생을 넣어 주세요.</p>':'')+
    '<div class="msg" id="mkMsg"></div><button class="btn pri" type="button" id="mkSave"'+(MK.bk.length>60||(!ADM&&!cls.length)?' disabled':'')+'>'+(X?'모의고사 내기':'과제 내기')+'</button> <button class="btn" type="button" id="mkPr">인쇄 미리 보기</button></div>'+
    '<h2>담은 문항 <span style="font-size:13px;font-weight:400;color:var(--sub)">줄을 누르면 문항이 보여요</span></h2><ul class="mk-l">'+MK.bk.map(function(k,i){ var it=MK.it[k]; return '<li><div class="mk-r" data-o2="'+esc(k)+'" style="grid-template-columns:34px 1fr 60px;cursor:pointer"><span style="color:var(--faint)">'+(i+1)+'</span><span>'+esc(it.title)+' <small>'+esc(srcN[k.split('|')[0]]||'')+(it.a?' · '+esc(it.a):'')+(it.nc?(it.ans?' · 정답 '+CIRC[it.ans-1]:''):' · 서술형')+'</small></span><button class="btn sm" type="button" data-rm="'+esc(k)+'">빼기</button></div>'+(MK.open2===k?'<div class="mk-v" id="mkV2"></div>':'')+'</li>'; }).join('')+'</ul>';
  var keep=function(){ MK.kind=$('mkK').value; MK.min=Math.round(+$('mkMin').value||0); MK.cls=$('mkC').value; };
  $('mkC').onchange=keep;
  $('mkPr').onclick=function(){ keep(); var items=finalItems(), key={}; items.forEach(function(x){ if(x.ans) key[x.k]=x.ans; }); printAsg({title:$('mkT').value||'과제',items:items,mode:MK.kind,min:MK.min,due:$('mkD').value},key); };
  $('mkK').onchange=function(){ var x=this.value==='exam', t=$('mkT'); $('mkMin').disabled=!x; $('mkXN').hidden=!x; $('mkSave').textContent=x?'모의고사 내기':'과제 내기';
    if(t.value===dstr+' 국어 과제'||t.value===dstr+' 모의고사') t.value=dstr+(x?' 모의고사':' 국어 과제'); keep(); };
  $('mkMin').onchange=keep;
  M.querySelectorAll('[data-o2]').forEach(function(r){ r.onclick=function(e){ if(e.target.closest('button')) return; keep(); MK.open2=MK.open2===r.dataset.o2?null:r.dataset.o2; var y=window.scrollY; mkForm(); window.scrollTo(0,y); }; });
  if(MK.open2&&$('mkV2')&&MK.it[MK.open2]) showItem(MK.it[MK.open2],$('mkV2'));
  $('mkB2').onclick=function(){ MK.step=1; makeView(); };
  M.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick=function(){ keep(); bkDel(b.dataset.rm); if(!MK.bk.length){ MK.step=1; return makeView(); } var y=window.scrollY; mkForm(); window.scrollTo(0,y); }; });
  $('mkSave').onclick=function(){ var b=this; $('mkMsg').textContent=''; keep();
    if(MK.kind==='exam'&&!(MK.min>=1)){ $('mkMsg').textContent='제한 시간(분)을 넣어 주세요.'; return; }

function admView(){
  M.innerHTML='<h1>선생님 관리</h1><p class="sub">관리자만 보는 화면입니다. 선생님 아이디는 로그인 창에서 따로 만들 수 없어요. 다른 선생님이 로그인 창의 \'처음 왔어요 · 아이디 만들기\'로 아이디를 만든 뒤, 그 아이디를 여기에 넣어 등록하면 그 선생님이 학급을 만들어 학생을 넣고, 자기 학급에 과제·모의고사·공지를 낼 수 있어요. 선생님은 자기 학급만 보고, 관리자는 모든 학급을 봅니다.</p>'+
    '<div class="card"><div class="bar" style="margin:0"><input type="text" id="taId" placeholder="선생님 아이디" style="width:200px"><button class="btn pri" type="button" id="taGo">선생님으로 등록</button></div><div class="msg" id="taM"></div></div><div id="taL" style="margin-top:16px"><p class="sub">불러오는 중…</p></div>';
  function list(r){ if(!r.ok){ $('taL').innerHTML='<p class="msg">'+esc(r.msg||'불러오지 못했어요.')+'</p>'; return; }
    $('taL').innerHTML=r.list.length?'<div class="tw"><table><thead><tr><th>선생님 아이디</th><th>담임 학급</th><th>등록한 날</th><th></th></tr></thead><tbody>'+r.list.map(function(t){ var cs=(D.cl||[]).filter(function(c){ return c.own===t.uid; }).map(function(c){ return c.name; }); return '<tr><td><b>'+esc(t.id)+'</b></td><td>'+(cs.length?esc(cs.join(', ')):'<span class="cnt">아직 없음</span>')+'</td><td>'+day(t.at)+'</td><td class="num"><button class="btn sm" type="button" data-rm="'+esc(t.uid)+'">선생님에서 빼기</button></td></tr>'; }).join('')+'</tbody></table></div>':'<p class="empty">등록한 선생님이 없어요. 관리자는 따로 등록하지 않아도 됩니다.</p>';
    $('taL').querySelectorAll('[data-rm]').forEach(function(b){ b.onclick=function(){ if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='정말 빼기'; return; } call('teacherRemove',[PW,b.dataset.rm]).then(list); }; }); }
  call('teacherList',[]).then(list);
  $('taGo').onclick=function(){ var v=$('taId').value.trim(); if(!v) return; $('taM').textContent=''; call('teacherAdd',[PW,v]).then(function(r){ if(!r.ok){ $('taM').textContent=r.msg; return; } $('taId').value=''; list(r); }); };
}
